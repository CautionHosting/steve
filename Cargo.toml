[workspace]
resolver = "3"
members = [
	"crates/steve",
	"crates/steve-cli",
	"crates/steve-sdk",
	"crates/steve-sdk-uniffi",
	"crates/steve-xwing-wasm",
]

[workspace.dependencies]
# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
bootproof-sdk = { git = "https://git.caution.co/public/bootproof.git", rev = "b346db17523ad9b13ef41eb9c14df3328bbd80d1", version = "0.1.0" }
