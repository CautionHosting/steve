[package]
name = "steve"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only OR Commercial"
publish = false

[features]
default = []
eval-attestation = ["dep:p384", "tower-http/trace"]

[[bin]]
name = "steve-eval"
path = "src/bin/steve-eval.rs"
required-features = ["eval-attestation"]

[dependencies]
# Crypto
rand = "0.8"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
x25519-dalek = "2.0.1"
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
bootproof = { git = "https://codeberg.org/caution/bootproof.git", rev = "78f531a2c245404a9d8879fb71cc397096ae0077", version = "0.1.0" }
p384 = { version = "0.13.1", features = ["ecdsa", "pem", "pkcs8"], optional = true }
zeroize = { version = "1.8", features = ["derive"] }

# Web
axum = { version = "0.8.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
ciborium = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.145"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.48.0", features = ["full", "macros"] }
url = "2"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
