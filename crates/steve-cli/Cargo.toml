[package]
name = "steve-cli"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[dependencies]
async-trait = "=0.1.89"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
http = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steve-sdk = { path = "../steve-sdk" }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-log = "0.2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = "2.5"
