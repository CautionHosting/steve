[package]
name = "steve-xwing-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
js-sys = "=0.3.83"
wasm-bindgen = "=0.2.106"
x-wing = { version = "=0.1.0", features = ["zeroize"] }
zeroize = "=1.8.2"

[dev-dependencies]
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
