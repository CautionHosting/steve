[package]
name = "steve-sdk"
version = "0.2.0"
edition = "2024"
readme = "README.md"

[dependencies]
aes-gcm = "0.10.3"
async-trait = "=0.1.89"
base64 = "0.22"
bootproof-sdk = { git = "https://git.distrust.co/public/bootproof.git", rev = "78f531a2c245404a9d8879fb71cc397096ae0077", version = "0.1.0" }
ciborium = "0.2"
coset = "0.4"
hkdf = "0.12.4"
rand = "0.8"
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["sync", "time"] }
url = "2"
x25519-dalek = "2.0.1"
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
zeroize = "1.8"
# Logging
tracing.workspace = true

[dev-dependencies]
axum = "0.8"
p384 = { version = "0.13.1", features = ["ecdsa", "pem", "pkcs8"] }
steve = { path = "../steve", features = ["eval-attestation"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "time"] }
x509-parser = "0.18"
rand_core = "0.10"
